syntax = "proto2";

import "antidote.proto";
option go_package = "potionDB/crdt/proto";

//protoc -I=. --go_out=. ./replicator.proto

message ProtoStableClock {
    required int32 senderID = 1;
    required int64 replicaTs = 2;
}

message ProtoReplicatePart {
    required int32 senderID = 1;
    required ProtoRemoteTxn txn = 2;
    required int64 partitionID = 3;
    required int32 txnID = 4; //Note: this ID is not the actual txnID, just an ID used to distinguish different txns
}

message ProtoReplicateGroupTxn {
    required int32 senderID = 1;
    repeated ProtoReplicateTxn txns = 2;
    required int32 minTxnID = 3;
    required int32 maxTxnID = 4;
}

message ProtoReplicateTxn {
    required int32 senderID = 1;
    required bytes timestamp = 2;
    repeated ProtoNewRemoteTxn part = 3; //One per partition in the txn
    required int32 txnID = 4;
}

message ProtoNewRemoteTxn {
    repeated ProtoDownstreamUpd upds = 1;
    required int64 partitionID = 2;
}

message ProtoRemoteTxn {
    required bytes timestamp = 1;
    repeated ProtoDownstreamUpd upds = 2;
}

message ProtoDownstreamUpd {
    required ApbBoundObject keyParams = 1;
    required ProtoOpDownstream op = 2;
}

message ProtoOpDownstream { //Note: if this gets over 32 fields, consider splitting into multiple messages (up to 32 fields are encoded with a single field byte). Or grouping similar types.
    oneof op {
        ProtoCounterDownstream counterOp = 1;
        ProtoSetDownstream setOp = 2;
        ProtoTopKRmvDownstream topkrmvOp = 3; //TopKRmvExt also uses this, as the data to be replicated is the same.
        ProtoLWWRegisterDownstream lwwregOp = 4;
        ProtoORMapDownstream ormapOp = 5;
        ProtoAvgDownstream avgOp = 6;
        ProtoMaxMinDownstream maxminOp = 7;
        ProtoRWEmbMapDownstream rwembmapOp = 8;
        ProtoTopSumDownstream topsumOp = 9;
        ProtoFlagDownstream flagOp = 10;
        ProtoBCounterDownstream bcounterOp = 11;
        ProtoTopKDownstream topkOp = 12;
        ProtoCounterFloatDownstream counterfloatOp = 13;
        ProtoTopKInitDownstream topkinitOp = 14;
        //ProtoResetDownstream resetOp = 15;
        ProtoPairCounterDownstream pairCounterOp = 16;
        ProtoArrayCounterDownstream arrayCounterOp = 17;
        ProtoArrayFloatDownstream arrayFloatOp = 18;
        ProtoMultiArrayDownstream multiArrayOp = 19;
        ProtoMVRegisterDownstream mvregOp = 20;
        ProtoSimpleDateDownstream simpleDateOp = 21;
        ProtoSetWDateDownstream setWDateOp = 22;
        ProtoIncWDateDownstream incWDateOp = 23;
        ProtoSetOnlyDateDownstream setOnlyDateOp = 24;
        ProtoCompactArrayDownstream compactArrayOp = 25;
        ProtoStringArrayDownstream stringArrayOp = 26;
        ProtoByteArrayDownstream byteArrayOp = 27;
        ProtoMapCounterDownstream mapCounterOp = 28;
        ProtoMultiUpdateDownstream multiUpdOp = 31;
    }
    optional SPECIAL_UPD specialop = 15; //Used to signal if it is a reset or multiupd. This is handy for more efficient processing, as sometimes CRDTType is not enough.
}

message ProtoCounterDownstream {
    required bool isInc = 1;
    required sint32 change = 2;
}

message ProtoCounterFloatDownstream {
    required bool isInc = 1;
    required double change = 2;
}

message ProtoLWWRegisterDownstream {
    required bytes value = 1;
    required uint64 tsId = 2; //Highest 48 bits is the timestamp; lowest 16 bits is the replicaID.
    //required int64 ts = 2;
    //required int32 replicaID = 3;
}

message ProtoSetDownstream {
    repeated ProtoValueUnique adds = 1; //key -> unique
    repeated ProtoValueUniques rems = 2; //key -> set/array of uniques
}

message ProtoORMapDownstream {
    repeated ProtoKeyValueUnique adds = 1; //key -> (element, unique)
    repeated ProtoORMapRemove rems = 2;
}

message ProtoTopKRmvDownstream {
    repeated ProtoTopKElement adds = 1;
    optional ProtoTopKRmvRemove rems = 2;
}

message ProtoTopKDownstream {
    repeated ProtoTopKScore adds = 1;
}

message ProtoTopKRmvRemove {
    repeated bytes vcs = 1; //If client-generated remove: only 1 entry. If topk-generated due to add: 1 entry per id.
    repeated sint32 ids = 2 [packed = true];
}

message ProtoTopKInitDownstream {
    required uint32 topSize = 1;
    optional uint32 notTopSize = 2; //Only used by TopKRmv.
    optional CRDT_type topType = 3; //If not present, it's assumed to be TopK.
}

message ProtoAvgDownstream {
    required sint64 sumValue = 1;
    required sint64 nAdds = 2;
}

message ProtoMaxMinDownstream {
    optional ProtoMaxDownstream max = 1;
    optional ProtoMinDownstream min = 2;
}

message ProtoMaxDownstream {
    required sint64 value = 1;
}

message ProtoMinDownstream {
    required sint64 value = 1;
}

message ProtoValueUnique {
    required bytes value = 1;
    required uint64 unique = 2;
}

message ProtoValueUniques {
    required bytes value = 1;
    repeated uint64 uniques = 2 [packed = true];
}

message ProtoKeyValueUnique {
    required bytes key = 1;
    required bytes element = 2;
    required uint64 unique = 3;
}

message ProtoORMapRemove {
    required bytes key = 1;
    repeated ProtoValueUniques elems = 2;
}

message ProtoTopKElement {
    required sint32 id = 1;
    required sint32 score = 2;
    //required int64 ts = 3;
    //required int32 replicaID = 4;
    required uint64 tsId = 3; //Highest 48 bits is the timestamp; lowest 16 bits is the replicaID.
    optional bytes data = 4;
}

message ProtoTopKScore {
    required sint32 id = 1;
    required sint32 score = 2;
    optional bytes data = 3;
}

message ProtoTopKIdVc {
    required int32 id = 1;
    required bytes vc = 2;
}

message ProtoRWEmbMapDownstream {
    optional ProtoRWEmbMapUpdates adds = 1;
    optional ProtoRWEmbMapRemoves rems = 2;
    optional ProtoRWEmbMapInit init = 3;
}

message ProtoRWEmbMapInit {
    required int64 size = 1;
    optional bool useMapWithSlice = 5; //If the map supports it, use a map backup up by a slice for fast reading of the full map.
    //If the above field is true, this field controls the degree of parallelism of full map reads.
    //One thread will be used per parallelReadFactor entries.
    optional int64 parallelReadFactor = 6; 
}

message ProtoRWEmbMapUpdates {
    repeated ProtoEmbMapUpd upds = 1;
    //repeated ProtoStableClock vc = 2;
    repeated int64 vc = 2 [packed = true]; //VC assuming that IDs are sorted.
    required int32 replicaID = 3;
    optional bool isArray = 4;  //If not present, it's assumed to be false.
    optional bool isFirstUpd = 5; //If not present, it's assumed to be false.
}

message ProtoRWEmbMapRemoves {
    repeated string keys = 1;
    required int64 ts = 2;
    required int32 replicaID = 3;
}

message ProtoEmbMapUpd {
    required bytes key = 1;
    required CRDT_type type = 2;
    required ProtoOpDownstream upd = 3;
}

message ProtoTopSumElement {
    required sint32 id = 1;
    required sint32 score = 2;
    optional bytes data = 3;
}

message ProtoTopSumDownstream {
    repeated ProtoTopSumElement elems = 1;
    required uint32 positiveLen = 2; //Set to 0 if all numbers are negative, or to length of elems if all are positive.
    optional int32 replicaID = 3; //Only required by adds (incs)
}

message ProtoFlagDownstream {
    optional ProtoEnableLWWDownstream enableLWW = 1;
    optional ProtoDisableLWWDownstream disableLWW = 2;
    optional ProtoEnableEWDownstream enableEW = 3;
    optional ProtoDisableEWDownstream disableEW = 4;
    optional ProtoEnableDWDownstream enableDW = 5;
    optional ProtoDisableDWDownstream disableDW = 6;
}

message ProtoEnableLWWDownstream {
    required int64 ts = 1;
    required int32 replicaID = 2;
}

message ProtoDisableLWWDownstream {
    required int64 ts = 1;
    required int32 replicaID = 2;
}

message ProtoEnableEWDownstream {
    required uint64 unique = 1;
}

message ProtoDisableEWDownstream {
    repeated uint64 seenUniques = 1 [packed = true]; 
}

message ProtoEnableDWDownstream {
    repeated uint64 seenUniques = 1 [packed = true];
}

message ProtoDisableDWDownstream {
    required uint64 unique = 1;
}

message ProtoBCounterDownstream {
    optional ProtoSetBoundCounterDownstream setBounds = 1;
    optional ProtoTransferCounterDownstream transfer = 2;
    optional ProtoIncBCounterDownstream inc = 3;
    optional ProtoDecBCounterDownstream dec = 4;
}

message ProtoSetBoundCounterDownstream {
    required sint32 limit = 1;
    required bool compEq = 2;
    required sint32 value = 3;
}

message ProtoTransferCounterDownstream {
    required sint32 transferValue = 1;
    required int32 fromID = 2;
    required int32 toID = 3;
}

message ProtoIncBCounterDownstream {
    required sint32 change = 1;
    required int32 replicaID = 2;
}

message ProtoDecBCounterDownstream {
    required sint32 change = 1;
    required int32 replicaID = 2;
}

message ProtoResetDownstream {
}

message ProtoPairCounterDownstream {
    required bool isInc = 1;
    optional sint32 firstChange = 2;
    optional double secondChange = 3;
}

message ProtoArrayCounterDownstream {
    required bool isInc = 1;
    oneof upd {
        ProtoArrayCounterIncrementDownstream inc = 2;
        ProtoArrayCounterIncrementAllDownstream incAll = 3;
        ProtoArrayCounterIncrementMultiDownstream incMulti = 4;
        ProtoArrayCounterIncrementSubDownstream incSub = 5;
        ProtoArraySetSize size = 6;
    }
}

message ProtoArrayCounterIncrementDownstream {
    required int32 index = 1;
    required sint64 inc = 2;
}

message ProtoArrayCounterIncrementAllDownstream {
    required sint64 inc = 1;
}

message ProtoArrayCounterIncrementMultiDownstream {
    repeated sint64 incs = 1 [packed = true];
}

message ProtoArrayCounterIncrementSubDownstream {
    repeated int32 indexes = 1 [packed = true];
    repeated sint64 incs = 2 [packed = true];
}

message ProtoArrayFloatDownstream {
    required bool isInc = 1;
    oneof upd {
        ProtoArrayFloatIncrementDownstream inc = 2;
        ProtoArrayFloatIncrementAllDownstream incAll = 3;
        ProtoArrayFloatIncrementMultiDownstream incMulti = 4;
        ProtoArrayFloatIncrementSubDownstream incSub = 5;
        ProtoArrayFloatIncrementRangeDownstream incRange = 6;
        ProtoArraySetSize size = 7;
    }
}

message ProtoArrayFloatIncrementDownstream {
    required int32 index = 1;
    required double inc = 2;
}

message ProtoArrayFloatIncrementAllDownstream {
    required double inc = 1;
}

message ProtoArrayFloatIncrementMultiDownstream {
    repeated double incs = 1 [packed = true];
}

message ProtoArrayFloatIncrementSubDownstream {
    repeated int32 indexes = 1 [packed = true];
    repeated double incs = 2 [packed = true];
}

message ProtoArrayFloatIncrementRangeDownstream {
    required int32 from = 1;
    required int32 to = 2;
    required double inc = 3;
}

message ProtoArraySetSize {
    required int32 size = 1;
}

message ProtoMultiArrayDownstream {
    required MultiArrayType type = 1;
    oneof upd {
        ProtoMultiArrayIntDownstream intUpd = 2;
        ProtoMultiArrayFloatDownstream floatUpd = 3;
        ProtoMultiArrayDataDownstream dataUpd = 4;
        ProtoMultiArrayAvgDownstream avgUpd = 5;
        ProtoMultiArrayMultiUpdateDownstream multiUpd = 6;
        ProtoMultiArraySetSizeDownstream sizeUpd = 7;
    }
}

message ProtoMultiArrayIntDownstream {
    oneof upd {
        ProtoMultiArrayIntIncDownstream inc = 1;
        ProtoMultiArrayIntIncSingleDownstream incSingle = 2;
        ProtoMultiArrayIntIncPositionsDownstream incPos = 3;
        ProtoMultiArrayIntIncRangeDownstream incRange = 4;
    }
}

message ProtoMultiArrayFloatDownstream {
    oneof upd {
        ProtoMultiArrayFloatIncDownstream inc = 1;
        ProtoMultiArrayFloatIncSingleDownstream incSingle = 2;
        ProtoMultiArrayFloatIncPositionsDownstream incPos = 3;
        ProtoMultiArrayFloatIncRangeDownstream incRange = 4;
    }
}

message ProtoMultiArrayDataDownstream {
    oneof upd {
        ProtoMultiArrayDataSetDownstream set = 1;
        ProtoMultiArrayDataSetSingleDownstream setSingle = 2;
        ProtoMultiArrayDataSetPositionsDownstream setPos = 3;
        ProtoMultiArrayDataSetRangeDownstream setRange = 4;
    }
}

message ProtoMultiArrayAvgDownstream {
    oneof upd {
        ProtoMultiArrayAvgIncDownstream inc = 1;
        ProtoMultiArrayAvgIncSingleDownstream incSingle = 2;
        ProtoMultiArrayAvgIncPositionsDownstream incPos = 3;
        ProtoMultiArrayAvgIncRangeDownstream incRange = 4;
    }
}

message ProtoMultiArrayIntIncDownstream {
    repeated sint64 changes = 1;
}

message ProtoMultiArrayIntIncSingleDownstream {
    required int32 pos = 1;
    required sint64 change = 2;
}

message ProtoMultiArrayIntIncPositionsDownstream {
    repeated int32 pos = 1 [packed = true];
    repeated sint64 change = 2 [packed = true]; //If only 1 value, the same value will be applied to all of pos.
}

message ProtoMultiArrayIntIncRangeDownstream {
    required int32 from = 1;
    required int32 to = 2;
    required sint64 change = 3;
}

message ProtoMultiArrayFloatIncDownstream {
    repeated double changes = 1 [packed = true];
}

message ProtoMultiArrayFloatIncSingleDownstream {
    required int32 pos = 1;
    required double change = 2;
}

message ProtoMultiArrayFloatIncPositionsDownstream {
    repeated int32 pos = 1 [packed = true];
    repeated double change = 2 [packed = true]; //If only 1 value, the same value will be applied to all of pos.
}

message ProtoMultiArrayFloatIncRangeDownstream {
    required int32 from = 1;
    required int32 to = 2;
    required double change = 3;
}

message ProtoMultiArrayDataSetDownstream {
    repeated bytes data = 1;
    required uint64 tsId = 2;
}

message ProtoMultiArrayDataSetSingleDownstream {
    required int32 pos = 1;
    required bytes data = 2;
    required uint64 tsId = 3;
}

message ProtoMultiArrayDataSetPositionsDownstream {
    repeated int32 pos = 1 [packed = true];
    repeated bytes data = 2; //If only 1 value, the same value will be applied to all of pos.
    required uint64 tsId = 3;
}

message ProtoMultiArrayDataSetRangeDownstream {
    required int32 from = 1;
    required int32 to = 2;
    required bytes data = 3;
    required uint64 tsId = 4;
}

message ProtoMultiArrayAvgIncDownstream {
    repeated sint64 value = 1 [packed = true];
    repeated sint32 count = 2 [packed = true];
}

message ProtoMultiArrayAvgIncSingleDownstream {
    required int32 pos = 1;
    optional sint32 count = 2;   //If not present, 1 is assumed.
    required sint64 value = 3;
}

message ProtoMultiArrayAvgIncPositionsDownstream {
    repeated int32 pos = 1 [packed = true];
    repeated sint64 value = 2 [packed = true];
    repeated sint32 count = 3 [packed = true];
}

message ProtoMultiArrayAvgIncRangeDownstream {
    required int32 from = 1;
    required int32 to = 2;
    required sint64 value = 3;
    required sint32 count = 4;
}

message ProtoMultiArrayMultiUpdateDownstream {
    repeated sint64 ints = 1 [packed = true];
    repeated double floats = 2 [packed = true];
    repeated bytes data = 3;
    optional uint64 tsId = 4;    //Only needed if data is set.
    repeated sint32 counts = 5 [packed = true];
    repeated sint64 sums = 6 [packed = true];
}

message ProtoMultiArraySetSizeDownstream {
    optional int32 intSize = 1;
    optional int32 floatSize = 2;
    optional int32 dataSize = 3;
    optional int32 avgSize = 4;
}

message ProtoMVRegisterDownstream {
    required bytes value = 1;
    required bytes clk = 2;
    required int32 replicaID = 3;
}

message ProtoSimpleDateDownstream {
    optional bool isInitialSet = 1;  //If not present, it's assumed to be false.
    required sint64 inc = 2;
}

message ProtoSetWDateDownstream {
    optional ProtoSetWIncDownstream setWInc = 1;
    optional ProtoSetWSetDownstream setWSet = 2;
}

message ProtoSetWIncDownstream {
    required bytes vc = 1;
    required sint64 inc = 2;
}

message ProtoSetWSetDownstream {
    required bytes vc = 1;
    required sint64 value = 2;
    required int32 replicaID = 3; 
}

message ProtoIncWDateDownstream {
    optional ProtoIncWIncDownstream incWInc = 1;
    optional ProtoIncWSetDownstream incWSet = 2;
}

message ProtoIncWIncDownstream {
    required sint64 inc = 1;
    required int32 replicaID = 2;
    required bytes vc = 3;
}

message ProtoIncWSetDownstream {
    required bytes vc = 1;
    required sint64 value = 2;
    required int32 replicaID = 3;
    repeated int32 seenIDs = 4 [packed = true];
    repeated int64 seenValues = 5 [packed = true];
    //map<int32,int64> seenIncs = 4; //replicaID -> value
}

message ProtoSetOnlyDateDownstream {
    required int64 value = 1;
    required int64 ts = 2;
    required int32 replicaID = 3;
}

message ProtoCompactArrayDownstream {
    optional ProtoCompactArraySetValue setValue = 1;
    optional ProtoCompactArrayIntInc intInc = 2;
    optional ProtoCompactArrayFloatInc floatInc = 3;
    optional ProtoCompactArraySetArray setArray = 4;
    optional ProtoCompactArraySetSize size = 5;
}

message ProtoCompactArraySetValue {
    required bytes value = 1;
    required int32 index = 2;
    required uint64 tsId = 3;
}

message ProtoCompactArrayIntInc {
    required sint32 inc = 1;
    required int32 index = 2;
}

message ProtoCompactArrayFloatInc {
    required double inc = 1;
    required int32 index = 2;
}

message ProtoCompactArraySetArray {
    repeated bytes data = 1;
    required uint64 tsId = 2;
}

message ProtoCompactArraySetSize {
    required int32 size = 1;
}

message ProtoStringArrayDownstream {
    optional ProtoStringArraySetValue setValue = 1;
    optional ProtoStringArraySetArray setArray = 2;
    optional ProtoStringArraySetArrayInit setArrayInit = 3;
    optional ProtoStringArraySetSize size = 4;
}

message ProtoStringArraySetArrayInit {
    repeated string data = 1;
}

message ProtoStringArraySetArray {
    repeated string data = 1;
    required uint64 tsId = 2;
}

message ProtoStringArraySetSize {
    required int32 size = 1;
}

message ProtoStringArraySetValue {
    required string value = 1;
    required int32 index = 2;
    required uint64 tsId = 3;
}

message ProtoByteArrayDownstream {
    oneof upd {
        ProtoByteArraySetValue setValue = 1;
        ProtoByteArraySetData setData = 2;
        ProtoByteArrayIntInc intInc = 3;
        ProtoByteArrayFloatInc floatInc = 4;
        ProtoByteArraySetDataInit setArrayInit = 5;
    }
}

message ProtoByteArraySetValue {
    required bytes value = 1;
    required int32 index = 2;
    required uint64 tsId = 3;
}

message ProtoByteArraySetData {
    required bytes data = 1;
    repeated uint32 dataStarts = 2 [packed = true];
    required uint64 tsId = 3;
}

message ProtoByteArraySetDataInit {
    required bytes data = 1;
    repeated uint32 dataStarts = 2 [packed = true];
}

message ProtoByteArrayIntInc {
    required sint32 inc = 1;
    required int32 index = 2;
}

message ProtoByteArrayFloatInc {
    required double inc = 1;
    required int32 index = 2;
}

message ProtoMapCounterDownstream {
    optional DATA_type dataType = 1;
    optional bool isDec = 2;
    oneof upd {
            ProtoMapCounterIntInc intInc = 3;
            ProtoMapCounterIntIncAll intIncAll = 4;
            ProtoMapCounterIntIncMult intIncMult = 5;
            ProtoMapCounterDoubleInc doubleInc = 6;
            ProtoMapCounterDoubleIncAll doubleIncAll = 7;
            ProtoMapCounterDoubleIncMult doubleIncMult = 8;
            ProtoMapCounterInit init = 9;
    }
}

message ProtoMapCounterIntInc {
    required int32 key = 1;
    required sint64 inc = 2;
    optional bytes data = 3;
}

message ProtoMapCounterIntIncAll {
    repeated int32 keys = 1 [packed = true];
    required sint64 inc = 2;
    optional bytes data = 3;
}

message ProtoMapCounterIntIncMult {
    repeated int32 keys = 1 [packed = true];
    repeated sint64 inc = 2 [packed = true];
    repeated bytes data = 3; //Optional
}

message ProtoMapCounterDoubleInc {
    required int32 key = 1;
    required double inc = 2;
    optional bytes data = 3;
}

message ProtoMapCounterDoubleIncAll {
    repeated int32 keys = 1 [packed = true];
    required double inc = 2;
    optional bytes data = 3;
}

message ProtoMapCounterDoubleIncMult {
    repeated int32 keys = 1 [packed = true];
    repeated double inc = 2 [packed = true];
    repeated bytes data = 3; //Optional
}

message ProtoMapCounterInit {
    required int32 size = 1;
}

message ProtoMultiUpdateDownstream {
    repeated ProtoOpDownstream updates = 1;
    required CRDT_type type = 2;
}

/*****REPLICA MANAGEMENT*****/

message ProtoRemoteID {
    required int32 replicaID = 1;
    repeated string myBuckets = 2;
    required string myIP = 3;
}

message ProtoJoin {
    repeated string buckets = 1;
    required int32 replicaID = 2;
    required string replicaIP = 3;
    //required int32 connID = 4;  //ConnID in the sender side for this replica. This information is needed later for requesting buckets.
}

message ProtoReplyJoin {
    repeated string buckets = 1; 
    //repeated ProtoClock partsClk = 2;
    repeated bytes partsClk = 2;
    required int32 replicaID = 3;
    //required int32 connID = 4;  //Used to know which connection to request the buckets from.
    required string replicaIP = 4; //Used to know which connection to request the buckets from.
}

/*
message ProtoClock {
    repeated ProtoStableClock entries = 1;
}*/

message ProtoRequestBucket {
    repeated string buckets = 1;
    //repeated ProtoClock partsClk = 2;
    //repeated bytes partsClk = 2;
    required int32 replicaID = 2;
    required string replicaIP = 3; //Used to know which connection to send the buckets to
}

//This contains CRDTs for all the buckets requested, not just one bucket.
message ProtoReplyBucket {
    required int32 replicaID = 1;
    required bytes clk = 2;
    repeated ProtoPartition parts = 3;
}

message ProtoPartition {
    repeated ProtoCRDT states = 1;
}

message ProtoCRDT {
    required uint64 keyHash = 1;
    required CRDT_type type = 2;
    required ProtoState state = 3;
}

//TODO: Clock for genericInversibleCRDT initialization? And replicaID.
message ProtoState {
    oneof state {
            ProtoCounterState counter = 1;
            ProtoLWWRegState lwwreg = 2;
            ProtoAWSetState awset = 3;
            ProtoORMapState ormap = 4;
            ProtoEmbMapState embmap = 5;
            ProtoMaxMinState maxmin = 6;
            ProtoTopKRmvState topkrmv = 7;
            ProtoAvgState avg = 8;
            ProtoTopSumState topsum = 9;
            ProtoFlagState flag = 10;
            ProtoBoundedCounterState bcounter = 11;
            ProtoTopKState topk = 12;
            ProtoCounterFloatState counterfloat = 13;
            ProtoPairCounterState pairCounter = 14;
            ProtoArrayCounterState arrayCounter = 15;
            ProtoArrayFloatState arrayFloat = 16;
            ProtoMultiArrayState multiArray = 17;
            ProtoMVRegState mvreg = 18;
            ProtoSimpleDateState simpleDate = 19;
            ProtoSetWDateState setWDate = 20;
            ProtoIncWDateState incWDate = 21;
            ProtoSetOnlyDateState setOnlyDate = 22;
            ProtoCompactArrayState compactArray = 23;
            ProtoStringArrayState stringArray = 24;
            ProtoByteArrayState byteArray = 25;
            ProtoMapCounterState mapCounter = 26;
    }
}

message ProtoReplyEmpty {

}

//*****STATES*****
message ProtoCounterState {required sint32 value = 1;}
message ProtoCounterFloatState { required double value = 1; }
message ProtoLWWRegState {
    required bytes value = 1;
    required uint64 tsId = 2; //Highest 48bits corresponds to the timestamp; lowest 16bits to the replicaID.
    //required int64 ts = 2;
    //required int32 replicaID = 3;
}
message ProtoAWSetState {repeated ProtoValueUniques elems = 1;}
message ProtoORMapState {repeated ProtoORMapRemove entries = 1;}
message ProtoEmbMapState {
    repeated ProtoEmbMapEntry crdts = 1;
    repeated ProtoEmbMapRemove removes = 2;
    //required ProtoClock rmvClock = 3;
    required bytes rmvClock = 3;
}
message ProtoEmbMapEntry {
    required string key = 1;
    required CRDT_type type = 2;
    required ProtoState state = 3;
}
message ProtoEmbMapRemove {
    required string key = 1;
    //repeated ProtoStableClock clks = 2; //TODO: Marks?
    repeated int64 clks = 2 [packed = true];
}
message ProtoMaxMinState {required sint64 value = 1;}
message ProtoAvgState {
    required sint64 sum = 1;
    required sint64 nAdds = 2;
}

//TODO: This one could be changed to just include the list of elements and maxElems,
//and then have everything else be calculated on the moment.
message ProtoTopKRmvState {
    repeated ProtoTopKElement elems = 1;
    repeated ProtoTopKIdVc rems = 2;
    //notTop maybe deserves its own msg? Since the key will be repeated.
    repeated ProtoTopKElement notTop = 3;
    //optional ProtoTopKElement smallest = 4;
    required int32 maxElems = 5;
    required int32 notTopSize = 6;
    required bytes vc = 7;
}

//TODO: Same improvement as in TopKState.
message ProtoTopSumState {
    repeated ProtoTopSumElement elems = 1;
    //note: this actually corresponds to notInTop - notPropagated (value-wise)
    repeated ProtoTopSumElement notTop = 2; 
    optional ProtoTopSumElement smallest = 3;
    required int32 maxElems = 4;
    //Note: notPropagated isn't included.
}

message ProtoTopKState {
    repeated ProtoTopKScore elems = 1;
    optional ProtoTopKScore smallest = 2;
    required int32 maxElems = 3;
    required bool keepTiedEntries = 4;
    repeated ProtoTopKScore tied = 5;
}

message ProtoFlagState {
    optional ProtoFlagLWWState lww = 1;
    optional ProtoFlagEWState ew = 2;
    optional ProtoFlagDWState dw = 3;
}
message ProtoFlagLWWState {
    required bool flag = 1;
    required int64 ts = 2;
    required int32 replicaID = 3;
}
message ProtoFlagEWState {repeated uint64 uniques = 1 [packed = true]; }
message ProtoFlagDWState {repeated uint64 uniques = 1 [packed = true];}

message ProtoBoundedCounterState { //NOTE: map<> is considered slow to marshall/unmarshall. Consider changing this if this is used in a hotspot.
    map<int32,int32> permissions = 1;
    map<int32,int32> decs = 2;
    required sint32 limit = 3;
    required sint32 value = 4;
}

message ProtoPairCounterState {
    required sint32 first = 1;
    required double second = 2;
}

message ProtoArrayCounterState {
    repeated sint64 counts = 1 [packed = true];
}

message ProtoArrayFloatState {
    repeated double values = 1 [packed = true];
}

message ProtoMultiArrayState {
    repeated sint64 intCounters = 1 [packed = true];
    repeated double floatCounters = 2 [packed = true];
    repeated bytes data = 3;
    repeated sint64 sums = 4 [packed = true];
    repeated sint64 counts = 5 [packed = true];
}

message ProtoMVRegState {
    required bytes value = 1;
    required bytes clk = 2;
    required int32 replicaID = 3;
    repeated bytes concValues = 4;
    repeated bytes concClks = 5; //Same size as concValues
}

message ProtoSimpleDateState {
    required int64 dateTs = 1;
}

message ProtoSetWDateState {
    required bytes setClk = 1;
    required int64 setValue = 2;
    required int64 setTs = 3;
    required int64 inc = 4;
    required int32 setReplicaID = 5;
    required bytes currClk = 6;
}

message ProtoIncWDateState { //NOTE: map<> is considered slow to marshall/unmarshall. Consider changing this if this is used in a hotspot.
    required bytes setClk = 1;
    required int64 setValue = 2;
    required int64 setTs = 3;
    required int32 setReplicaID = 4;
    map<int32,int64> incs = 5; //replicaID -> value
    map<int32,int64> cancels = 6;
    map<int32,int64> cancelsTs = 7;
    required bytes currClk = 8;
}

message ProtoSetOnlyDateState {
    required int64 dateTs = 1;
    required int64 writeTs = 2;
    required int32 replicaID = 3;
}

message ProtoCompactArrayState {
    repeated bytes data = 1;
    repeated uint64 tsId = 2 [packed = true];
}

message ProtoStringArrayState {
    repeated string data = 1;
    repeated uint64 tsId = 2 [packed = true];
}

message ProtoByteArrayState {
    required bytes data = 1;
    repeated uint32 dataStarts = 2 [packed = true];
    repeated uint64 tsId = 3 [packed = true];
}

message ProtoMapCounterState {  //Only one between intValues and doubleValues should be set
    required DATA_type dataType = 1;
    repeated int32 keys = 2 [packed = true];
    repeated sint64 intValues = 3 [packed = true];
    repeated double doubleValues = 4 [packed = true];
}